name: Deploy to DigitalOcean Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install DigitalOcean CLI (doctl)
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate with DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and Tag Docker Image
        run: |
          docker build -t ://digitalocean.com{{ secrets.REGISTRY_NAME }}/nodejs-app:${{ github.sha }} \.

      - name: Push Image to DigitalOcean Container Registry
        run: |
          docker push ://digitalocean.com{{ secrets.REGISTRY_NAME }}/nodejs-app:${{ github.sha }}

      - name: Configure Kubernetes Cluster Credentials
        run: |
          doctl kubernetes cluster kubeconfig save ${{ secrets.CLUSTER_NAME }}

      - name: Update Manifest Placeholders
        run: |
          sed -i 's/REGISTRY_NAME/${{ secrets.REGISTRY_NAME }}/g' kubernetes.yaml
          sed -i 's/IMAGE_TAG/${{ github.sha }}/g' kubernetes.yaml

      - name: Deploy Manifests to Kubernetes
        run: |
          kubectl apply -f kubernetes.yaml

      - name: Verify Deployment Status
        run: |
          kubectl rollout status deployment/nodejs-app-deployment
